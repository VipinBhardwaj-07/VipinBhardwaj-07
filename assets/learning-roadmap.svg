<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
<title id="title">Learning roadmap</title>
<desc id="desc">Three connected learning tracks: computer science foundations, full-stack product development, and applied AI and data.</desc>
<defs>
<linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#8b7cff"/><stop offset=".52" stop-color="#51e0c0"/><stop offset="1" stop-color="#77b9ff"/></linearGradient>
<linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7cff" stop-opacity=".14"/><stop offset="1" stop-color="#8b7cff" stop-opacity=".02"/></linearGradient>
<linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#51e0c0" stop-opacity=".12"/><stop offset="1" stop-color="#51e0c0" stop-opacity=".02"/></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#77b9ff" stop-opacity=".12"/><stop offset="1" stop-color="#77b9ff" stop-opacity=".02"/></linearGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
</defs>
<rect x="1" y="1" width="1198" height="258" rx="22" fill="#0d1117" stroke="#fff" stroke-opacity=".1"/>
<rect x="2" y="2" width="1196" height="256" rx="21" fill="url(#grid)"/>
<text x="32" y="38" font-family="'Fira Code',Consolas,'Courier New',monospace" font-size="12" font-weight="700" letter-spacing="1.8" fill="#94a3b8">THREE TRACKS  /  ONE GOAL: BUILD WITH PURPOSE</text>
<line x1="32" y1="56" x2="1168" y2="56" stroke="#fff" stroke-opacity=".1"/>
<path d="M208 103H992" fill="none" stroke="url(#line)" stroke-opacity=".5" stroke-width="2"/>
<path d="M208 103H992" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2" stroke-dasharray="24 768"><animate attributeName="stroke-dashoffset" values="0;-792;0" dur="9s" repeatCount="indefinite"/></path>
<circle cx="208" cy="103" r="4" fill="#a99cff"><animate attributeName="r" values="4;5.5;4" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="600" cy="103" r="4" fill="#75e5c8"><animate attributeName="r" values="4;5.5;4" dur="3s" begin=".7s" repeatCount="indefinite"/></circle>
<circle cx="992" cy="103" r="4" fill="#92c9ff"><animate attributeName="r" values="4;5.5;4" dur="3s" begin="1.4s" repeatCount="indefinite"/></circle>
<circle r="3.5" fill="#fff" opacity=".9"><animateMotion dur="9s" repeatCount="indefinite" path="M208 103H992"/></circle>

<rect x="32" y="78" width="356" height="150" rx="16" fill="url(#violet)" stroke="#8b7cff" stroke-opacity=".38"/>
<circle cx="63" cy="103" r="16" fill="#8b7cff" fill-opacity=".16" stroke="#a99cff" stroke-opacity=".7"/>
<text x="63" y="108" text-anchor="middle" font-family="'Fira Code',Consolas,'Courier New',monospace" font-size="12" font-weight="700" fill="#c3baff">01</text>
<text x="91" y="108" font-family="'Fira Code',Consolas,'Courier New',monospace" font-size="11" font-weight="700" letter-spacing="1" fill="#a99cff">STRENGTHEN THE CORE</text>
<text x="54" y="151" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#f1efff">Computer science foundations</text>
<text x="54" y="180" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="14" fill="#cbd5e1">Data structures · algorithms · Python · Java</text>
<text x="54" y="207" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="13" fill="#a99cff">Think clearly. Solve problems deliberately.</text>

<rect x="422" y="78" width="356" height="150" rx="16" fill="url(#mint)" stroke="#51e0c0" stroke-opacity=".38"/>
<circle cx="453" cy="103" r="16" fill="#51e0c0" fill-opacity=".14" stroke="#75e5c8" stroke-opacity=".7"/>
<text x="453" y="108" text-anchor="middle" font-family="'Fira Code',Consolas,'Courier New',monospace" font-size="12" font-weight="700" fill="#9cf1da">02</text>
<text x="481" y="108" font-family="'Fira Code',Consolas,'Courier New',monospace" font-size="11" font-weight="700" letter-spacing="1" fill="#75e5c8">MAKE USEFUL THINGS</text>
<text x="444" y="151" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#e9fff8">Full-stack product development</text>
<text x="444" y="180" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="14" fill="#cbd5e1">Interfaces · React · JavaScript · APIs</text>
<text x="444" y="207" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="13" fill="#75e5c8">Connect a thoughtful UI to working software.</text>

<rect x="812" y="78" width="356" height="150" rx="16" fill="url(#blue)" stroke="#77b9ff" stroke-opacity=".38"/>
<circle cx="843" cy="103" r="16" fill="#77b9ff" fill-opacity=".14" stroke="#92c9ff" stroke-opacity=".7"/>
<text x="843" y="108" text-anchor="middle" font-family="'Fira Code',Consolas,'Courier New',monospace" font-size="12" font-weight="700" fill="#b2dcff">03</text>
<text x="871" y="108" font-family="'Fira Code',Consolas,'Courier New',monospace" font-size="11" font-weight="700" letter-spacing="1" fill="#92c9ff">EXPLORE WITH EVIDENCE</text>
<text x="834" y="151" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#edf7ff">Applied AI &amp; data</text>
<text x="834" y="180" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="14" fill="#cbd5e1">Analytics · machine learning · computer vision</text>
<text x="834" y="207" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="13" fill="#92c9ff">Explore patterns. Evaluate results honestly.</text>
</svg>
