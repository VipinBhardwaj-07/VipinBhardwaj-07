<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="120" viewBox="0 0 1200 120">
<title>Project portfolio metrics</title>
<desc>Four projects, analysis of one thousand records, nine charts, and two completed internships.</desc>
<defs>
<linearGradient id="a" x1="0" x2="1"><stop offset="0" stop-color="#8b7cff"/><stop offset="1" stop-color="#c0a5ff"/></linearGradient>
<linearGradient id="b" x1="0" x2="1"><stop offset="0" stop-color="#51e0c0"/><stop offset="1" stop-color="#7bf0ce"/></linearGradient>
<linearGradient id="c" x1="0" x2="1"><stop offset="0" stop-color="#f2b879"/><stop offset="1" stop-color="#ffd09b"/></linearGradient>
<linearGradient id="d" x1="0" x2="1"><stop offset="0" stop-color="#77b9ff"/><stop offset="1" stop-color="#91d9f1"/></linearGradient>
</defs>
<g><rect x="1" y="5" width="285" height="110" rx="18" fill="#0d1117" stroke="#8b7cff" stroke-opacity=".5"/>
<rect x="1" y="5" width="285" height="110" rx="18" fill="#8b7cff" fill-opacity=".06"/>
<text x="25" y="54" font-family="'Fira Code',Consolas,'Courier New',monospace" font-size="13" font-weight="700" letter-spacing="1.2" fill="#a99cff">01 / BUILD</text>
<text x="25" y="87" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="url(#a)">4 projects</text></g>
<g><rect x="306" y="5" width="285" height="110" rx="18" fill="#0d1117" stroke="#51e0c0" stroke-opacity=".5"/>
<rect x="306" y="5" width="285" height="110" rx="18" fill="#51e0c0" fill-opacity=".05"/>
<text x="330" y="54" font-family="'Fira Code',Consolas,'Courier New',monospace" font-size="13" font-weight="700" letter-spacing="1.2" fill="#75e5c8">02 / ANALYZE</text>
<text x="330" y="87" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="url(#b)">1,000 records</text></g>
<g><rect x="611" y="5" width="285" height="110" rx="18" fill="#0d1117" stroke="#f2b879" stroke-opacity=".5"/>
