<text x="635" y="54" font-family="'Fira Code',Consolas,'Courier New',monospace" font-size="13" font-weight="700" letter-spacing="1.2" fill="#ffc88e">03 / VISUALIZE</text>
<text x="635" y="87" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="url(#c)">9 charts</text></g>
<g><rect x="916" y="5" width="283" height="110" rx="18" fill="#0d1117" stroke="#77b9ff" stroke-opacity=".5"/>
<rect x="916" y="5" width="283" height="110" rx="18" fill="#77b9ff" fill-opacity=".05"/>
<text x="940" y="54" font-family="'Fira Code',Consolas,'Courier New',monospace" font-size="13" font-weight="700" letter-spacing="1.2" fill="#92c9ff">04 / GROW</text>
<text x="940" y="87" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="url(#d)">2 internships</text></g>
